services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tg_rating
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/tg_rating
      PORT: 4000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:3000:80'
    depends_on:
      - backend

volumes:
  pgdata:
